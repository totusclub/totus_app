# Онбординг: 4 экрана «Далее» → «Пользовательское соглашение приложения» → «Я согласен».
# Тексты: src/component/onboarding/*.
appId: ${APP_ID}
---
- assertVisible:
    text: "Найдите тур"
    label: "Онбординг: первый экран"
- repeat:
    times: 6
    while:
      visible: "Далее"
    commands:
      - tapOn:
          text: "Далее"
          label: "Онбординг: «Далее»"
- assertVisible:
    text: "Пользовательское соглашение приложения"
    label: "Онбординг: экран соглашения"
- tapOn:
    text: "Я согласен"
    label: "Онбординг: «Я согласен»"
