# Закрывает системные окна, которые могут появиться поверх приложения:
# iOS «Разрешить отслеживание» (App Tracking Transparency), запрос уведомлений,
# шторка приложения «Включить уведомления?». Везде выбираем «не разрешать» / «не сейчас».
# Все шаги необязательные: если окна нет — ничего не происходит.
appId: ${APP_ID}
---
- tapOn:
    text: "(Попросить приложение не отслеживать|Попросить не отслеживать|Ask App Not to Track)"
    optional: true
    label: "iOS: отказ от отслеживания (если спросили)"
- tapOn:
    text: "(Не разрешать|Запретить|Don.t [Aa]llow)"
    optional: true
    label: "Системный запрос: не разрешать (если спросили)"
- tapOn:
    text: "Не сейчас"
    optional: true
    label: "Шторка уведомлений: «Не сейчас» (если показана)"
