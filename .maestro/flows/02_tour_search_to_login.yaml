# Сквозной путь «Тур с перелётом» до бронирования — как ежечасный чекап сайта:
# поиск (Москва → Египет по умолчанию) → отель → номер и предложение → перелёт →
# «Перейти к бронированию». Гость получает экран «Вход» (норма); с QA-учёткой
# открывается форма бронирования. Ничего не заполняем и не отправляем.
# «Выбрать N ₽» создаёт пакет в API (как кнопка «Выбрать» на сайте) — это не заказ.
appId: ${APP_ID}
name: "02 Тур: поиск → отель → перелёт → вход"
tags:
  - daily
---
- runFlow: ../subflows/start.yaml
- tapOn:
    text: "(Тур|Тур.*С перелётом.*)"
    label: "Режим «Тур» (с перелётом)"
- extendedWaitUntil:
    visible: ".*Москва.*"
    timeout: 20000
    label: "Город вылета загрузился (иначе «Найти» не сработает)"
- tapOn:
    text: "Найти"
    label: "«Найти»"

# Выдача отелей
- extendedWaitUntil:
    visible: "(Найдено \\d+ отел.*|Ошибка)"
    timeout: 90000
    label: "Выдача отелей: «Найдено N отелей» (до 90 с)"
- assertNotVisible:
    text: "Ошибка"
    label: "Выдача не пустая (нет экрана «Ошибка … не найдено ни одного тура»)"
- takeScreenshot: 02_search_results
- runFlow: ../subflows/dismiss_system_prompts.yaml
- tapOn:
    text: ".*от \\d+ .*ноч.*"
    index: 0
    label: "Открыть первый отель (по строке «от <дата> на N ночей» на карточке)"

# Страница отеля
- extendedWaitUntil:
    visible: "Выбрать номер"
    timeout: 30000
    label: "Страница отеля: кнопка «Выбрать номер» (до 30 с)"
- takeScreenshot: 02_hotel
- tapOn:
    text: "Выбрать номер"
    label: "«Выбрать номер» — прокрутка к номерам"
- extendedWaitUntil:
    visible: "(Все варианты|К сожалению, для данного отеля нет доступных номеров)"
    timeout: 45000
    label: "Номера загрузились (до 45 с)"
- assertNotVisible:
    text: "К сожалению, для данного отеля нет доступных номеров"
    label: "У первого отеля есть номера"
- tapOn:
    text: "Все варианты"
    index: 0
    label: "Первый номер: «Все варианты»"
- extendedWaitUntil:
    visible: ".*\\d+ ночей.*"
    timeout: 20000
    label: "Окно предложений: есть варианты с ночами и ценой"
- tapOn:
    text: ".*\\d+ ночей.*"
    index: 0
    label: "Выбрать первое предложение"
- takeScreenshot: 02_offers
# В подвале окна два одинаковых текста «Выбрать N ₽»: подпись (выше) и кнопка (ниже) —
# AllOptionsModalContent.tsx. Нажимаем вторую — кнопку.
- tapOn:
    text: "Выбрать .*₽"
    index: 1
    label: "Кнопка «Выбрать N ₽»"

# Выбор перелёта
- extendedWaitUntil:
    visible: "(Найдено вариантов: \\d+|На эти даты пока нет доступных вариантов перелёта.*)"
    timeout: 90000
    label: "Перелёты: «Найдено вариантов: N» (до 90 с)"
- assertNotVisible:
    text: "На эти даты пока нет доступных вариантов перелёта.*"
    label: "Есть хотя бы один перелёт"
- takeScreenshot: 02_tickets
- tapOn:
    text: ".*(Прямой|С пересадкой).*"
    index: 0
    label: "Открыть первый рейс"
- extendedWaitUntil:
    visible: "Перейти к бронированию"
    timeout: 20000
    label: "Детали рейса: «Перейти к бронированию»"
- assertVisible:
    text: "Перелёт туда"
    label: "В деталях есть перелёт туда"
- takeScreenshot: 02_ticket_details
- tapOn:
    text: "Перейти к бронированию"
    label: "«Перейти к бронированию»"

# Гость → «Вход»; QA-учётка → форма бронирования. Ничего не вводим и не отправляем.
- extendedWaitUntil:
    visible: "(Вход|Ваш заказ|Туристы|Отправить запрос)"
    timeout: 30000
    label: "Дальше — экран «Вход» (гость) или бронирование (QA-учётка), до 30 с"
- runFlow:
    when:
      visible: "Вход"
    commands:
      - assertVisible:
          text: "Войти"
          label: "Гость: экран «Вход» с кнопкой «Войти»"
- assertNotVisible:
    text: "Не удалось выполнить (пребук перелёта|предпросмотр заказа).*"
    label: "Бронирование открылось без ошибки пребука"
- takeScreenshot: 02_login_or_booking
