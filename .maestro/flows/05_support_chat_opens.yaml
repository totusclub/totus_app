# Чат с поддержкой — только с QA-учёткой: «Аккаунт» → «Чат с поддержкой».
# Проверяем, что экран и поле ввода открываются. Сообщения НЕ отправляем —
# их увидят живые сотрудники поддержки в панели звонков.
appId: ${APP_ID}
name: "05 Чат с поддержкой открывается"
tags:
  - auth
---
- runFlow: ../subflows/start.yaml
- tapOn:
    text: "Аккаунт.*"
    label: "Вкладка «Аккаунт»"
- assertNotVisible:
    text: "Вход"
    label: "На устройстве выполнен вход QA-учёткой (не экран «Вход»)"
- scrollUntilVisible:
    element:
      text: ".*Чат с поддержкой.*"
    direction: DOWN
    timeout: 20000
    label: "Пункт «Чат с поддержкой» в профиле"
- tapOn:
    text: ".*Чат с поддержкой.*"
    label: "Открыть «Чат с поддержкой»"
- extendedWaitUntil:
    visible: "(Напишите сообщение…|.*Сообщение в поддержку.*)"
    timeout: 20000
    label: "Экран чата с полем «Напишите сообщение…»"
- takeScreenshot: 05_support_chat
- tapOn:
    text: "Назад"
    optional: true
    label: "Выйти из чата"
